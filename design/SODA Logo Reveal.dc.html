    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    g.connect(f); f.connect(air);
    [[freq, 1], [freq * 1.003, 0.7], [freq * 1.5, 0.2]].forEach(([hz, mix]) => {
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = hz;
      const mg = ctx.createGain(); mg.gain.value = mix;
      o.connect(mg); mg.connect(g);
      o.start(t); o.stop(t + dur + 0.2); this.track(o);
    });
  }

  scheduleSound() {
    const a = this.ensureAudio();
    if (!a || !this.soundOn) return;
    this.stopScheduled();
    const ctx = a.ctx;
    const rate = this.props.speed ?? 1;
    const t0 = ctx.currentTime + 0.08;
    const at = s => t0 + s / rate;

    // cues mirror the template's animation delays
    // arrival chimes rise through a major set: G–B–D–G
    const letters = [
      { in: 0.15, out: 1.18, hz: 146.83, bell: 392.00 },   // S
      { in: 0.75, out: 1.78, hz: 174.61, bell: 493.88 },   // O
      { in: 1.35, out: 2.62, hz: 220.00, bell: 587.33 },   // D
      { in: 2.25, out: 3.22, hz: 261.63, bell: 783.99 }    // A
    ];
    letters.forEach(l => {
      this.swish(at(l.in), (l.out - l.in) / rate, 0.075, 240, 2400);
      this.bell(at(l.out), l.bell, 0.05, 3.6);
    });

    // plus symbol — bright add9 chime, clear of the D arrival
    this.bell(at(2.9), 987.77, 0.062, 4.4, [[1, 1], [1.125, 0.45], [1.5, 0.55], [2, 0.3], [3, 0.12]]);

    // dots — ascending major triad
    [[3.35, 783.99], [3.45, 987.77], [3.55, 1174.66]].forEach(([t, hz]) => this.bell(at(t), hz, 0.05, 3.4));

    // press-fit: base slides, tab seats
    this.swish(at(4.5), 1.0 / rate, 0.06, 200, 1200);
    this.swish(at(4.6), 0.85 / rate, 0.055, 1800, 400);
    this.bell(at(5.45), 293.66, 0.06, 2.6, [[1, 1], [2, 0.4], [3, 0.16]]);

    // CHALLENGE fade-in
    this.swish(at(3.5), 1.4 / rate, 0.05, 300, 1900);

    // partner stickers landing
    [[7.35, 392.00], [7.55, 493.88], [7.75, 587.33]].forEach(([t, hz]) => {
      this.swish(at(t) - 0.12, 0.3 / rate, 0.035, 900, 2600);
      this.bell(at(t), hz, 0.042, 3.2);
    });
  }

  renderVals() {
    return {
      rootRef: this.rootRef,
      svgRef: this.svgRef,
      soundBtnRef: this.soundBtnRef,
      toggleSound: () => {
        this.soundOn = !this.soundOn;
        const b = this.soundBtnRef.current;
        if (b) b.textContent = this.soundOn ? 'Sound off' : 'Sound on';
        this.apply();
        if (this.soundOn) { this.replayAll(); } else if (this.audio) { this.stopScheduled(); this.audio.master.gain.value = 0; }
      },
      replay: () => this.replayAll(),
      discover: () => {
        const doc = document.documentElement;
        if (doc.scrollHeight - window.innerHeight > 8) window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
        else window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
  }

  replayAll() {
    this.anims().forEach(a => {
      const n = a.animationName || '';
      if (n.indexOf('float') !== 0 && n !== 'hover3d') { a.currentTime = 0; a.play(); }
    });
    this.apply();
    if (this.soundOn) this.scheduleSound();
  }
}
</script>
</body>
