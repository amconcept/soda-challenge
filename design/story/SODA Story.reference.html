<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOD+A Story reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
<!--
  SOD+A STORY — reference page
  Open this file in a browser. It mocks the site hero closely enough to judge the
  hand-off: the logo-first balloon reveal on load, "Watch the story", and the film
  ending in the same reveal, popping into the site's own lockup, which then floats.

  It is a reference, not production code. Cursor rebuilds the page side in the
  site's React hero; the engine itself (components/story/engine/) ships as is.
  Bundled engine below = components/story/engine/*.js, built with esbuild.
-->
<style>
  :root {
    --page-bg: hsl(160 18% 90%);   /* the site's ScrollHue wash, animated below */
    --hero-line: #0e0d0c;
    --stroke-weight: 5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page-bg); color: var(--hero-line); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { font: inherit; color: inherit; }

  /* ---------- hero (simplified from components/hero/hero.css) ---------- */
  .hero { position: relative; width: 100%; height: 92vh; min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vh; padding: 2vh 0 4vh; overflow: hidden; }
  .hero-play { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1 1 auto; min-height: 0; width: 100%; height: 100%; gap: inherit; transition: opacity .4s ease; }
  .hero-stage { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .hero-mark { width: min(70%, 920px); height: 100%; }
  /* width and height 100% + the viewBox: the lockup letterboxes inside the stage instead of overflowing it */
  .hero-lockup { width: 100%; height: 100%; overflow: visible; color: var(--hero-line); display: block; }
  .hero-lockup .strokes { stroke-width: var(--stroke-weight); }

  /* ---------- the reveal hand-off ----------
     Hidden parts keep their layout, so the balloons can aim at real positions.
     A pop shows the part with the same overshoot test 04 used (0.8 → 1, back-out, 0.3s),
     then the site's own float loops take over. Nothing floats before it has landed. */
  [data-reveal]:not(.is-in) { opacity: 0; }
  [data-reveal].is-in { animation: revealPop .3s cubic-bezier(.34, 1.56, .64, 1) both; transform-box: fill-box; transform-origin: center; }
  [data-reveal].is-in.instant { animation: none; }
  @keyframes revealPop { from { opacity: 0; transform: scale(.8); } 27% { opacity: 1; } to { opacity: 1; transform: scale(1); } }

  .float-box, .dot, .glyph { transform-box: fill-box; transform-origin: center; }
  .is-in .float-a { animation: floatA var(--float-dur, 6.4s) ease-in-out .3s infinite; }
  .is-in .float-b { animation: floatB var(--float-dur, 7.6s) ease-in-out .3s infinite; }
  .is-in .float-c { animation: floatC var(--float-dur, 6.9s) ease-in-out .3s infinite; }
  .is-in .float-d { animation: floatD var(--float-dur, 6.2s) ease-in-out .3s infinite; }
  @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  @keyframes floatB { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(14px) rotate(.4deg); } }
  @keyframes floatC { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes floatD { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(8px) rotate(-.3deg); } }

  /* partner row: the fourth balloon's pop lands the stickers, staggered like the site */
  .hero-partners { --sticker-size: clamp(68px, 12.5vh, 104px); display: flex; flex-direction: column; align-items: center; gap: 5vh; margin-top: -4vh; z-index: 2; }
  .hero-partners[data-reveal]:not(.is-in) { opacity: 1; }
  .hero-partners-label { display: flex; align-items: center; gap: 14px; opacity: 0; }
  .hero-rule { width: 46px; height: 1px; background: currentColor; opacity: .45; }
  .hero-partners-label span { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; opacity: .7; }
  .hero-stickers { display: flex; align-items: center; justify-content: center; gap: clamp(24px, 4vw, 52px); flex-wrap: wrap; min-height: var(--sticker-size); }
  .sticker { height: var(--sticker-size); width: auto; opacity: 0; }
  .sticker img { height: 100%; width: auto; display: block; }
  .sticker-invite { width: clamp(52px, 9.5vh, 72px); height: clamp(52px, 9.5vh, 72px); border-radius: 50%; background: #f7f2ea; box-shadow: inset 0 0 0 2px #111; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: clamp(6px, .9vh, 8px); letter-spacing: .12em; text-transform: uppercase; line-height: 1.2; padding: 8px; }
  .hero-partners.is-in { animation: none; }
  .hero-partners.is-in .hero-partners-label { animation: fadeIn .6s ease-out both; }
  .hero-partners.is-in .sticker { animation: stickerIn .8s cubic-bezier(.2, 1.3, .4, 1) var(--d, 0s) both, floatC var(--float-dur, 7s) ease-in-out calc(var(--d, 0s) + .8s) infinite; }
  .hero-partners.is-in.instant .hero-partners-label, .hero-partners.is-in.instant .sticker { animation: none; opacity: 1; }
  @keyframes stickerIn { from { opacity: 0; transform: translateY(26px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- buttons: same pill recipe as DISCOVER ---------- */
  .hero-actions { display: flex; gap: 14px; margin-top: 5vh; opacity: 0; pointer-events: none; transition: opacity .8s ease-out; z-index: 2; flex-wrap: wrap; justify-content: center; }
  .hero[data-mode="rest"] .hero-actions { opacity: 1; pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; gap: 12px; background: transparent; border: 1px solid currentColor; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; padding: 13px 26px 13px 28px; border-radius: 999px; cursor: pointer; }
  .pill:hover, .pill:focus-visible { outline: none; background: color-mix(in srgb, var(--hero-line) 6%, transparent); }
  .pill svg { flex: none; }

  /* ---------- the story layer ---------- */
  .story-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .hero[data-mode="story"] .hero-play { opacity: 0; pointer-events: none; }
  .hero[data-mode="story"][data-chapter="reveal"] .hero-play { opacity: 1; }
  /* bottom right, out of the way of the action, where people look for Skip on any video */
  .story-controls { position: absolute; right: 18px; bottom: 18px; z-index: 4; display: flex; justify-content: flex-end; gap: 10px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .hero[data-mode="story"] .story-controls { opacity: 1; pointer-events: auto; }
  .story-controls .pill { padding: 9px 18px; font-size: 11px; letter-spacing: .18em; background: color-mix(in srgb, var(--page-bg) 70%, transparent); }
  .story-progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); background: var(--hero-line); opacity: .35; z-index: 4; }
  .hero:not([data-mode="story"]) .story-progress { opacity: 0; }

  /* Fullscreen on phones: the film is 16:9, so it gets the whole screen. */
  .hero:fullscreen { height: 100vh; background: var(--page-bg); }

  @media (prefers-reduced-motion: reduce) {
    [data-reveal].is-in, .is-in .float-a, .is-in .float-b, .is-in .float-c, .is-in .float-d, .hero-partners.is-in .sticker, .hero-partners.is-in .hero-partners-label { animation: none !important; opacity: 1; }
  }

  /* ---------- review panel (reference only, not for the site) ---------- */
  .review { position: fixed; left: 16px; bottom: 16px; z-index: 20; font-size: 11px; }
  .review > summary { list-style: none; cursor: pointer; border: 1px solid currentColor; border-radius: 999px; padding: 8px 14px; letter-spacing: .14em; text-transform: uppercase; background: color-mix(in srgb, var(--page-bg) 80%, white); }
  .review > summary::-webkit-details-marker { display: none; }
  .review .box { position: absolute; left: 0; bottom: 44px; width: min(360px, calc(100vw - 32px)); background: #fbfaf7; color: #141414; border: 1px solid #141414; border-radius: 14px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .12); }
  .review .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .review label { display: grid; grid-template-columns: 70px 1fr 44px; align-items: center; gap: 8px; }
  .review input[type=range] { width: 100%; accent-color: #141414; }
  .review .mini { border: 1px solid #141414; border-radius: 999px; background: none; padding: 5px 10px; cursor: pointer; font-size: 11px; }
  .review .mini[aria-pressed="true"] { background: #141414; color: #fbfaf7; }
  .review .scrub { position: relative; }
  .review .beats { position: relative; height: 16px; }
  .review .beats span { position: absolute; transform: translateX(-2px); font-size: 9px; opacity: .65; white-space: nowrap; }
  .review .note { opacity: .7; line-height: 1.4; }
  .review output { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
