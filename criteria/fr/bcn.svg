.5">Montrez comment vous avez combiné</tspan><tspan x="0" y="31.0">différentes technologies et outils de</tspan><tspan x="0" y="46.5">fabrication numérique pour prototyper</tspan><tspan x="0" y="62.0">des idées partageables numériquement.</tspan><tspan x="0" y="87.5" font-weight="700">Entièrement partageable +</tspan><tspan x="0" y="103.0" font-weight="700">évolutif :</tspan><tspan x="0" y="118.5">Publiez les fichiers et détails utiles</tspan><tspan x="0" y="134.0">pour que d'autres puissent refaire,</tspan><tspan x="0" y="149.5">apprendre et adapter votre travail.</tspan></text></svg>